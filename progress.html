<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mindup – Assistance</title>

  
  <script src="https://cdn.tailwindcss.com"></script>

  
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  
  <link rel="stylesheet" href="style.css">


  <script src="components.js" defer></script>
</head>

<body>

  <div id="header-placeholder"></div>

  <main class="py-12">
    <section class="container mx-auto px-4">

      <div class="grid md:grid-cols-2 gap-10 items-start">

        
        <div class="flex flex-col gap-8 dashboard-left">

          <div class="title-block">
            <h1 class="text-2xl font-semibold mb-6">Marquez vos jours</h1>

            <div class="flex items-center gap-6 centered-elements">

              <div class="select-wrapper">
                <select>
                  <option>Hebdomadaire</option>
                  <option>Mensuel</option>
                </select>
              </div>

              <a href="progress_details.html" >
              <div class="progress-card flex flex-col items-center justify-center gap-2">
                <span class="material-icons">menu_book</span>
                <p>Suivi de progrès</p>
                
              </div>
            </a>
            </div>
          </div>

        </div>

       
        <div class="chart-card">
          <svg viewBox="0 0 300 200">
            <line x1="40" y1="10" x2="40" y2="170" />
            <line x1="40" y1="170" x2="280" y2="170" />

            <text x="10" y="140">25%</text>
            <text x="10" y="110">50%</text>
            <text x="10" y="80">75%</text>
            <text x="5" y="50">100%</text>

            <text x="60" y="190">Lun</text>
            <text x="110" y="190">Mar</text>
            <text x="160" y="190">Mer</text>
            <text x="210" y="190">Jeu</text>
            <text x="260" y="190">Ven</text>

            <polyline points="60,130 110,110 160,70 210,55 260,30" />
            <circle cx="60" cy="130" r="4" />
            <circle cx="110" cy="110" r="4" />
            <circle cx="160" cy="70" r="4" />
            <circle cx="210" cy="55" r="4" />
            <circle cx="260" cy="30" r="4" />
          </svg>
        </div>

      </div>

    </section>
  </main>

  <div id="footer-placeholder"></div>

</body>
</html>
