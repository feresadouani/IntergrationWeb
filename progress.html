<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mindup - Assistance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!-- Compiled CSS from SCSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Script to load components -->
    <script src="components.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

 <!-- Main Content -->
    <main>
  <section class="dashboard container mx-auto px-4 py-12">
  <div class="dashboard-grid">
    
    <!-- LEFT COLUMN -->
    <div class="dashboard-left">
      <div class="title-block">
  <h1>Mark your days</h1>

  <div class="centered-elements">
    <div class="select-wrapper">
      <select>
        <option>Weekly</option>
        <option>Monthly</option>
      </select>
    </div>

    <div class="progress-card">
      <span class="material-icons">menu_book</span>
      <p>Suivi de progrès</p>
    </div>
  </div>
</div>

    </div>

    <!-- RIGHT COLUMN -->
    <div class="chart-card">
      <svg viewBox="0 0 300 200">
        <line x1="40" y1="10" x2="40" y2="170" />
        <line x1="40" y1="170" x2="280" y2="170" />

        <text x="10" y="140">25%</text>
        <text x="10" y="110">50%</text>
        <text x="10" y="80">75%</text>
        <text x="5" y="50">100%</text>

        <text x="60" y="190">Mon</text>
        <text x="110" y="190">Tue</text>
        <text x="160" y="190">Wed</text>
        <text x="210" y="190">Thu</text>
        <text x="260" y="190">Fri</text>

        <polyline points="60,130 110,110 160,70 210,55 260,30" />
        <circle cx="60" cy="130" r="4" />
        <circle cx="110" cy="110" r="4" />
        <circle cx="160" cy="70" r="4" />
        <circle cx="210" cy="55" r="4" />
        <circle cx="260" cy="30" r="4" />
      </svg>
    </div>

  </div>
</section>

</main>


    <!-- Footer will be loaded here -->
    <div id="footer-placeholder"></div>
</body>

</html>
