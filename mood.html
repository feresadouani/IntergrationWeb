<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mindup – Mood</title>

  <script src="https://cdn.tailwindcss.com"></script>


  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <link rel="stylesheet" href="style.css">
  <script src="components.js" defer></script>
</head>


<body class="bg-white">

  <div id="header-placeholder"></div>

  <main class="py-14">
    <section class="max-w-3xl mx-auto px-4 flex flex-col items-center gap-10">

      <h1 class="mood-title text-center">
        Comment vous sentez-vous en ce moment ?
      </h1>


      <div class="mood-emojis">
        <img src="images/cry.png" data-gif="images/cry.gif" class="emoji" alt="Très triste">
        <img src="images/sad.png" data-gif="images/sad.gif" class="emoji" alt="Triste">
        <img src="images/neutral.png" data-gif="images/neutral.gif" class="emoji" alt="Neutre">
        <img src="images/good.png" data-gif="images/good.gif" class="emoji" alt="Bien">
        <img src="images/happy.png" data-gif="images/happy.gif" class="emoji" alt="Très heureux">
      </div>



      <input type="range" min="0" max="100" step="0.01" value="50" id="moodSlider"
        class="mood-slider w-full max-w-xl" />
      <button id="moodButton"
        class="mood-button mt-6 px-8 py-3 rounded-full font-semibold text-white transition-colors duration-300">
        Neutre ✔
      </button>

      <p id="moodMessage" class="text-center text-lg font-medium mt-4 opacity-0 transition-opacity duration-300"></p>
      <a id="progressLink" href="progress_details.html"
        class="mt-4 text-sm font-semibold underline opacity-0 pointer-events-none transition-opacity duration-300">
        Voir les détails de progression →
      </a>

    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script>
    const slider = document.getElementById('moodSlider');
    const emojis = document.querySelectorAll('.emoji');
    const button = document.getElementById('moodButton');
    const message = document.getElementById('moodMessage');

    let submitted = false;

    const moods = [
      {
        name: 'Très triste',
        color: '#60a5fa',
        message: "C'est lourd. Tu n'as pas à tout réparer aujourd'hui. Nous sommes là."
      },
      {
        name: 'Triste',
        color: '#818cf8',
        message: "Hmm… journée difficile. Ça ne restera pas comme ça pour toujours."
      },
      {
        name: 'Neutre',
        color: '#34d399',
        message: "Pas génial, pas terrible. Parfois, c'est parfaitement acceptable."
      },
      {
        name: 'Bien',
        color: '#fbbf24',
        message: "Sympa. Accroche-toi à ce sentiment et profites-en un peu."
      },
      {
        name: 'Très heureux',
        color: '#fb7185',
        message: "J'adore cette énergie. Continue de faire ce qui t'a amené ici."
      }
    ];

    function updateMood(value) {
      if (submitted) return;

      const zone = Math.min(4, Math.floor(value / 20));
      const mood = moods[zone];

      emojis.forEach((emoji, index) => {
        const isActive = index === zone;
        emoji.classList.toggle('active', isActive);

        emoji.src = isActive
          ? emoji.dataset.gif
          : emoji.dataset.gif.replace('.gif', '.png');
      });

      slider.style.background = `
      linear-gradient(
        90deg,
        ${mood.color} ${value}%,
        #e5e7eb ${value}%
      )
    `;

      button.textContent = `${mood.name} ✔`;
      button.style.backgroundColor = mood.color;
    }

    button.addEventListener('click', () => {
      if (submitted) return;

      submitted = true;
      slider.disabled = true;

      const zone = Math.min(4, Math.floor(slider.value / 20));
      const mood = moods[zone];

      button.textContent = 'Submitted ✔';
      button.style.backgroundColor = mood.color;
      button.classList.add('cursor-default');

      message.textContent = mood.message;
      message.style.color = mood.color;
      message.classList.remove('opacity-0');
    });
    const progressLink = document.getElementById('progressLink');

    progressLink.classList.remove('opacity-0', 'pointer-events-none');
    progressLink.classList.add('opacity-100');

    updateMood(slider.value);
    slider.addEventListener('input', (e) => updateMood(e.target.value));
  </script>





</body>

</html>
