<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mindup - Assistance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!-- Compiled CSS from SCSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Script to load components -->
    <script src="components.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

 <!-- Main Content -->
    <main class="assistance-page min-h-screen flex flex-col justify-start pt-12">
        <section class="assistance-container px-4 py-8 md:px-8">

            <!-- Left Content -->
            <div class="assistance-text mb-8 md:mb-0 max-w-lg">
                <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-4 leading-tight">Talk to an Expert</h1>
                <p class="subtitle text-lg font-medium text-teal-600 mb-2">
                    Get clarity, support, or guidance anytime
                </p>
                <p class="description text-slate-500 max-w-md mb-6">
                    Our certified experts are here to help you understand, manage,
                    and overcome your challenges
                </p>

                <div class="features flex flex-col md:flex-row gap-6 mb-8">
                    <div class="feature flex items-center gap-2 text-teal-600 font-medium">
                        <span class="material-icons text-5 leading-5">lock</span>
                        <span>Confidential</span>
                    </div>
                    <div class="feature flex items-center gap-2 text-teal-600 font-medium">
                        <span class="material-icons text-5 leading-5">verified</span>
                        <span>Certified Experts</span>
                    </div>
                </div>

<a href="./ExpertConvo.html" class="start-chat-btn inline-flex items-center justify-center px-8 py-3 bg-gradient-to-r from-teal-400 to-teal-500 text-white font-semibold rounded-full hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 w-fit">
    Start Chat
</a>

            </div>

            <!-- Right Cards -->
            <div class="assistance-cards flex flex-col gap-8">
                <div class="assistance-card bg-gradient-to-br from-sky-400 to-teal-400 text-white p-10 md:p-14 rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-200 min-w-80">
                    <span class="material-icons card-icon text-7xl mb-6 block">chat</span>
                    <h3 class="text-3xl font-semibold mb-3">Live Chat</h3>
                    <p class="text-lg opacity-95">Instant messaging support</p>
                </div>

                <div class="assistance-card bg-gradient-to-br from-sky-400 to-teal-400 text-white p-10 md:p-14 rounded-2xl shadow-xl hover:shadow-2xl hover:-translate-y-1 transition-all duration-200 min-w-80">
                    <span class="material-icons card-icon text-7xl mb-6 block">school</span>
                    <h3 class="text-3xl font-semibold">Coaching Session</h3>
                </div>
            </div>

        </section>
    </main>

    <!-- Footer will be loaded here -->
    <div id="footer-placeholder"></div>
</body>

</html>
