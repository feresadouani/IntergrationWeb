<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mindup - Assistance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!-- Compiled CSS from SCSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Script to load components -->
    <script src="components.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

 <!-- Main Content -->
    <main class="assistance-page">
        <section class="assistance-container">

            <!-- Left Content -->
            <div class="assistance-text">
                <h1>Talk to an Expert</h1>
                <p class="subtitle">
                    Get clarity, support, or guidance anytime
                </p>
                <p class="description">
                    Our certified experts are here to help you understand, manage,
                    and overcome your challenges
                </p>

                <div class="features">
                    <div class="feature">
                        <span class="material-icons">lock</span>
                        <span>Confidential</span>
                    </div>
                    <div class="feature">
                        <span class="material-icons">verified</span>
                        <span>Certified Experts</span>
                    </div>
                </div>

<a href="./ExpertConvo.html" class="start-chat-btn">
    Start Chat
</a>

            </div>

            <!-- Right Cards -->
            <div class="assistance-cards">
                <div class="assistance-card">
                    <span class="material-icons card-icon">chat</span>
                    <h3>Live Chat</h3>
                    <p>Instant messaging support</p>
                </div>

                <div class="assistance-card">
                    <span class="material-icons card-icon">school</span>
                    <h3>Coaching Session</h3>
                </div>
            </div>

        </section>
    </main>

    <!-- Footer will be loaded here -->
    <div id="footer-placeholder"></div>
</body>

</html>
