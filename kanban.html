<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban | MindUp</title>

  <!-- Main CSS -->
  <link rel="stylesheet" href="assets/css/main.css">

  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

  <!-- HEADER -->
  <div id="header-placeholder"></div>

  <!-- KANBAN BOARD -->
  <main class="kanban-board">
    <div class="kanban-header">
      <h1 class="kanban-title">Kanban</h1>
          <button id="add-task-btn" class="button primary">
            <span class="material-icons">add</span>
            Add Task
          </button>
    </div>

    <section class="kanban-columns">
      <!-- TODO Column -->
      <div class="kanban-column">
        <h2 class="kanban-column-title">TODO</h2>
        <div class="kanban-list">
          <div class="kanban-card card-yellow">Task A</div>
          <div class="kanban-card card-green">Task B</div>
        </div>
      </div>

      <!-- IN PROGRESS Column -->
      <div class="kanban-column">
        <h2 class="kanban-column-title">IN PROGRESS</h2>
        <div class="kanban-list">
          <div class="kanban-card card-blue">Task C</div>
          <div class="kanban-card card-orange">Task D</div>
        </div>
      </div>

      <!-- DONE Column -->
      <div class="kanban-column">
        <h2 class="kanban-column-title">DONE</h2>
        <div class="kanban-list">
          <div class="kanban-card card-yellow">Task E</div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <div id="footer-placeholder"></div>

  <!-- JS -->
  <script src="assets/js/load-components.js"></script>
  <script src="assets/js/kanban.js"></script>
</body>
</html>
