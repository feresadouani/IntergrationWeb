<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kanban | MindUp</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-container">
      <!-- Logo -->
      <a href="#" class="logo-link">
        <img src="assets/img/logo.png" alt="MindUp Logo" class="logo-image">
      </a>

      <!-- Navigation -->
      <nav class="nav">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">Tasks</a>
        <a href="#" class="nav-link">Projects</a>
        <div class="nav-dropdown">
          <span class="dropdown-trigger nav-link">
            More <span class="dropdown-arrow">▼</span>
          </span>
          <div class="dropdown-menu">
            <a href="#" class="dropdown-item">Settings</a>
            <a href="#" class="dropdown-item">Profile</a>
            <a href="#" class="dropdown-item">Logout</a>
          </div>
        </div>
      </nav>

      <!-- Header Icons -->
      <div class="header-icons">
        <div class="icon-wrapper">
          <span class="material-icons">notifications</span>
        </div>
        <div class="icon-wrapper">
          <span class="material-icons">chat</span>
        </div>
      </div>
    </div>
  </header>

  <!-- KANBAN BOARD -->
  <main class="kanban-board">
    <div class="kanban-header">
      <h1 class="kanban-title">Kanban</h1>
      <button class="button primary">Add Task</button>
    </div>

    <section class="kanban-columns">
      <!-- TODO Column -->
      <div>
        <h2 class="kanban-column-title">TODO</h2>
        <div class="kanban-list">
          <div class="kanban-card card-yellow">Task A</div>
          <div class="kanban-card card-green">Task B</div>
        </div>
      </div>

      <!-- IN PROGRESS Column -->
      <div>
        <h2 class="kanban-column-title">IN PROGRESS</h2>
        <div class="kanban-list">
          <div class="kanban-card card-blue">Task C</div>
          <div class="kanban-card card-orange">Task D</div>
        </div>
      </div>

      <!-- DONE Column -->
      <div>
        <h2 class="kanban-column-title">DONE</h2>
        <div class="kanban-list">
          <div class="kanban-card card-yellow">Task E</div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-container">
      <!-- Footer Logo -->
      <div class="footer-logo">
        <a href="#" class="logo-link">
          <img src="assets/img/logo.png" alt="MindUp Logo" class="logo-image">
        </a>
      </div>

      <!-- Footer Contact -->
      <div class="footer-contact">
        <span class="contact-label">Contact us: info@mindup.com</span>
        <div class="social-icons">
          <a href="#" class="social-icon"><span class="material-icons">facebook</span></a>
          <a href="#" class="social-icon"><span class="material-icons">twitter</span></a>
          <a href="#" class="social-icon"><span class="material-icons">linkedin</span></a>
        </div>
      </div>
    </div>
  </footer>

  <script src="assets/js/kanban.js"></script>
</body>
</html>
