<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mindup - Kanban</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <!-- Compiled CSS from SCSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Script to load shared header/footer -->
  <script src="components.js" defer></script>
</head>

<body>
  <div id="header-placeholder"></div>

  <!-- KANBAN BOARD -->
  <main class="main-content kanban-board">
    <div class="kanban-header">
      <h1 class="kanban-title">Kanban</h1>
      <button class="button primary">Ajouter une tâche</button>
    </div>

    <section class="kanban-columns">
      <!-- TODO Column -->
      <div>
        <h2 class="kanban-column-title">À FAIRE</h2>
        <div class="kanban-list">
          <div class="kanban-card card-yellow">Tâche A</div>
          <div class="kanban-card card-green">Tâche B</div>
        </div>
      </div>

      <!-- IN PROGRESS Column -->
      <div>
        <h2 class="kanban-column-title">EN COURS</h2>
        <div class="kanban-list">
          <div class="kanban-card card-blue">Tâche C</div>
          <div class="kanban-card card-orange">Tâche D</div>
        </div>
      </div>

      <!-- DONE Column -->
      <div>
        <h2 class="kanban-column-title">TERMINÉ</h2>
        <div class="kanban-list">
          <div class="kanban-card card-yellow">Tâche E</div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer will be loaded here -->
  <div id="footer-placeholder"></div>
</body>
</html>
