<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mindup - La tranquillité d'esprit commence ici</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="style.css">
    <script src="components.js"></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="content-container">
            <div class="left-section">
                <h1 class="headline">La tranquillité d'esprit commence ici.</h1>
                <button class="start-button">
                    <span>Start</span>
                </button>

                <div class="features">
                    <div class="feature-item">
                        <span class="material-icons">check_circle</span>
                        <span>Tasks</span>
                    </div>
                    <div class="feature-item">
                        <span class="material-icons">schedule</span>
                        <span>Kanban</span>
                    </div>
                    <div class="feature-item">
                        <span class="material-icons">calendar_today</span>
                        <span>Follow-Up</span>
                    </div>
                </div>
            </div>

            <div class="right-section">
                <div class="card focus-mode-card">
                    <div class="card-icon">
                        <img src="images/focus.png" alt="Focus Mode" class="card-icon-image">
                    </div>
                    <h3 class="card-title">Focus Mode</h3>
                </div>

                <div class="card mini-game-card">
                    <div class="card-icon">
                        <img src="images/console.png" alt="Mini Game" class="card-icon-image">
                    </div>
                    <h3 class="card-title">Mini Game</h3>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be loaded here -->
    <div id="footer-placeholder"></div>
</body>

</html>
