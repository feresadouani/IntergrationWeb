<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindUp Header</title>

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="assets/css/main.css">

  <style>
    /* Smooth arrow rotation on dropdown */
    .nav-dropdown .dropdown-arrow {
      display: inline-block;
      transition: transform 0.3s ease;
    }
    .nav-dropdown:hover .dropdown-arrow {
      transform: rotate(180deg); /* arrow points up on hover */
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-container">

    <!-- Logo -->
    <div class="logo">
      <a href="./index.html" class="logo-link">
        <img src="assets/images/mindupLogo.png" alt="MindUp Logo" class="logo-image">
      </a>
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <a href="./index.html" class="nav-link">Home</a>
      <div class="nav-separator"></div>

      <!-- Stress Dropdown -->
      <div class="nav-dropdown">
        <a href="#" class="nav-link dropdown-trigger">
          Stress <span class="material-icons dropdown-arrow">keyboard_arrow_down</span>
        </a>
        <div class="dropdown-menu">
          <a href="#" class="dropdown-item">Mini Games</a>
          <a href="./daily-task.html" class="dropdown-item">Daily Task</a>
          <a href="#" class="dropdown-item">Podcast</a>
          <a href="#" class="dropdown-item">Break</a>
          <a href="#" class="dropdown-item">Live Streaming</a>
        </div>
      </div>
      <div class="nav-separator"></div>

      <!-- Overload Dropdown -->
      <div class="nav-dropdown">
        <a href="#" class="nav-link dropdown-trigger">
          Overload <span class="material-icons dropdown-arrow">keyboard_arrow_down</span>
        </a>
        <div class="dropdown-menu">
          <a href="#" class="dropdown-item">Focus Mode</a>
          <a href="#" class="dropdown-item">Agenda</a>
          <a href="#" class="dropdown-item">Tasks</a>
        </div>
      </div>
      <div class="nav-separator"></div>

      <!-- Assistance Dropdown -->
      <div class="nav-dropdown">
        <a href="#" class="nav-link dropdown-trigger">
          Assistance <span class="material-icons dropdown-arrow">keyboard_arrow_down</span>
        </a>
        <div class="dropdown-menu">
          <a href="./mood.html" class="dropdown-item">What's my mood</a>
          <a href="#" class="dropdown-item">Friend Support</a>
          <a href="./progress.html" class="dropdown-item">Plans & Stats</a>
          <a href="#" class="dropdown-item">Discussion</a>
          <a href="#" class="dropdown-item">Expert Support</a>
        </div>
      </div>
      <div class="nav-separator"></div>

      <!-- AI Link -->
      <a href="./chat.html" class="nav-link">Ai</a>
    </nav>

    <!-- Header Icons -->
    <div class="header-icons">
      <div class="icon-wrapper">
        <span class="material-icons">notifications</span>
      </div>
      <div class="icon-wrapper">
        <span class="material-icons">dark_mode</span>
      </div>
      <div class="icon-wrapper">
        <span class="material-icons">person</span>
      </div>
    </div>

  </div>
</header>

</body>
</html>
