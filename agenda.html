<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mindup - Agenda Intelligente</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

  <!-- Compiled CSS from SCSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Components -->
  <script src="components.js"></script>
</head>

<body class="agenda-page flex flex-col min-h-screen">
  <!-- Header -->
  <div id="header-placeholder"></div>

  <!-- Main -->
  <main class="agenda-container flex-1">

    <!-- Top Header -->
    <div class="agenda-header flex items-start justify-between mb-12 relative">

      <!-- Centered Title -->
      <div class="flex flex-col items-center mx-auto text-center">
        <!-- Page Title -->
        <div class="agenda-title">
          <h1>Agenda Intelligente</h1>
        </div>
      </div>

   
    </div>

    <!-- Calendar Grid -->
    <div class="agenda-grid">

      <!-- Days Header -->
      <div class="agenda-days">
        <span>lundi</span>
        <span>mardi</span>
        <span>mercredi</span>
        <span>jeudi</span>
        <span>vendredi</span>
        <span>samedi</span>
        <span>dimanche</span>
      </div>

      <!-- Agenda Columns -->
      <div class="agenda-columns">
        <div class="agenda-col"></div>
        <div class="agenda-col"></div>
        <div class="agenda-col"></div>
        <div class="agenda-col"></div>
        <div class="agenda-col"></div>
        <div class="agenda-col"></div>
        <div class="agenda-col"></div>
      </div>
    </div>

    <!-- Bottom Actions -->
    <div class="agenda-actions mt-14 flex items-center">
      <a href="./kanban.html" class="agenda-btn shadow-md hover:shadow-lg transition">
        <span class="material-icons">view_kanban</span>
        Kanban
      </a>

      <button class="agenda-btn shadow-md hover:shadow-lg transition">
        <span class="material-icons">auto_awesome</span>
        Optimiser ma journée
      </button>
    </div>

  </main>

  <!-- Footer -->
  <div id="footer-placeholder"></div>
</body>
</html>
