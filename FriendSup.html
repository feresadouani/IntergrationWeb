<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mindup - FriendsUp</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <!-- Compiled CSS from SCSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Script to load components -->
  <script src="components.js"></script>
</head>

<body>
  <div id="header-placeholder"></div>

  <!-- Main Content -->
  <main class="friendsup-page flex flex-col md:flex-row h-screen md:h-[calc(100vh-80px)] bg-white">
    <!-- USERS LIST -->
    <aside class="users-list md:w-72 border-r border-gray-200 p-6 bg-gradient-to-b from-slate-50 to-white overflow-y-auto">
      <h2 class="text-2xl font-bold text-slate-900 mb-6">Users</h2>

      <div class="user px-4 py-3 mb-3 rounded-lg border border-gray-200 hover:border-teal-400 hover:bg-teal-50 cursor-pointer transition-all duration-200 flex items-center gap-3 text-slate-800 font-medium" data-user="anon1">
        <span class="material-icons text-teal-600">person</span>
        Anonymous #1023
      </div>

      <div class="user px-4 py-3 mb-3 rounded-lg border border-gray-200 hover:border-teal-400 hover:bg-teal-50 cursor-pointer transition-all duration-200 flex items-center gap-3 text-slate-800 font-medium" data-user="anon2">
        <span class="material-icons text-teal-600">person</span>
        Anonymous #8471
      </div>

      <div class="user px-4 py-3 mb-3 rounded-lg border border-gray-200 hover:border-teal-400 hover:bg-teal-50 cursor-pointer transition-all duration-200 flex items-center gap-3 text-slate-800 font-medium" data-user="anon3">
        <span class="material-icons text-teal-600">person</span>
        Anonymous #5569
      </div>

      <div class="user px-4 py-3 mb-3 rounded-lg border border-gray-200 hover:border-teal-400 hover:bg-teal-50 cursor-pointer transition-all duration-200 flex items-center gap-3 text-slate-800 font-medium" data-user="anon4">
        <span class="material-icons text-teal-600">person</span>
        Anonymous #2190
      </div>
    </aside>

    <!-- WELCOME CARD / MIDDLE MESSAGE -->
    <div class="welcome-card flex-1 flex flex-col items-center justify-center bg-gradient-to-br from-cyan-50 to-teal-50 rounded-lg m-4 md:m-8" id="welcomeCard">
      <h1 class="text-5xl md:text-6xl font-bold text-slate-900 mb-4">FriendsUP</h1>
      <p class="text-xl text-slate-600 font-medium">Select someone you'd like to talk with</p>
    </div>
  </main>

  <!-- CHAT POPUP -->
  <div class="chat-popup hidden fixed bottom-4 right-4 w-96 bg-white rounded-xl shadow-2xl border border-gray-200 flex flex-col z-50" id="chatPopup">
    <div class="chat-header flex justify-between items-center bg-gradient-to-r from-teal-500 to-cyan-500 text-slate-900 p-4 rounded-t-xl">
      <span id="chatTitle" class="font-bold text-lg">Chat</span>
      <span class="material-icons close-btn cursor-pointer hover:bg-black hover:bg-opacity-10 rounded-full p-1 transition-colors duration-200" id="closeChat">close</span>
    </div>
    <div class="messages flex-1 overflow-y-auto p-4 space-y-3 max-h-80" id="popupMessages">
      <div class="message other px-3 py-2 bg-gray-100 rounded-lg text-slate-700 max-w-xs">Select a user to start a conversation</div>
    </div>
    <form id="popupForm" class="chat-input border-t border-gray-200 p-4 flex gap-2 items-center">
      <input type="text" id="popupInput" placeholder="Type a message..." required class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-slate-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all duration-200" />
      <button type="submit" class="px-4 py-2 bg-gradient-to-r from-teal-500 to-cyan-500 text-white font-semibold rounded-lg hover:shadow-lg transition-all duration-200 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-teal-500">Send</button>
    </form>
  </div>

  <div id="footer-placeholder"></div>

  <script src="friendsup.js"></script>
</body>

</html>
