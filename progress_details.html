<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mindup – Progress Details</title>

  
  <script src="https://cdn.tailwindcss.com"></script>

  
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  
  <link rel="stylesheet" href="style.css">

 
  <script src="components.js" defer></script>
</head>

<body>

  <div id="header-placeholder"></div>

  <main class="py-12">
    <div class="progress-wrapper max-w-4xl mx-auto px-4 flex flex-col gap-12">

     
      <section class="progress-details">
        <h1 class="text-2xl font-semibold mb-6">Progress Details</h1>

        <div class="details-card flex items-center gap-6">
          <div class="emoji">
            <span class="material-icons">sentiment_satisfied</span>
          </div>

          <div class="details-text">
            <h2 class="font-medium">Monday, 12 April</h2>
            <p>Sat</p>
            <p class="trend">+3% since last week</p>
          </div>
        </div>
      </section>

      
      <section class="checkins">
        <h2 class="text-xl font-semibold mb-4">Recent Check-ins</h2>

        <div class="checkins-table flex flex-col gap-3">

          <div class="table-header flex justify-between font-medium">
            <span>Date</span>
            <span>Score</span>
            <span>Mood Trajectory</span>
          </div>

          <div class="table-row flex justify-between items-center">
            <span>Monday, 5 April</span>
            <span class="material-icons mood happy">sentiment_satisfied</span>
            <span class="positive">+3%</span>
          </div>

          <div class="table-row flex justify-between items-center">
            <span>Monday, 29 March</span>
            <span class="material-icons mood neutral">sentiment_neutral</span>
            <span class="negative">-2%</span>
          </div>

          <div class="table-row flex justify-between items-center">
            <span>Monday, 22 March</span>
            <span class="material-icons mood sad">sentiment_dissatisfied</span>
            <span class="negative">-6%</span>
          </div>

          <div class="table-row flex justify-between items-center">
            <span>Monday, 15 March</span>
            <span class="material-icons mood happy">sentiment_satisfied</span>
            <span class="positive">+1%</span>
          </div>

        </div>
      </section>

    </div>
  </main>

  <div id="footer-placeholder"></div>

</body>
</html>
